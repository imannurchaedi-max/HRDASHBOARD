<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">HR Dashboard semantic and neural runtime map</title>
  <desc id="desc">Layered HR Dashboard architecture showing source ownership, prepared cache, endpoint-to-view mapping, and active semantic and neural indexes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#152448"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#172554"/><stop offset="1" stop-color="#0b5265"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#38bdf8"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#34d399"/></marker>
    <marker id="violetArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#a78bfa"/></marker>
    <style>
      .h { font-family: Arial, sans-serif; font-weight: 700; fill: #f8fafc; }
      .t { font-family: Arial, sans-serif; fill: #cbd5e1; }
      .s { font-family: Arial, sans-serif; font-size: 13px; fill: #94a3b8; }
      .nt { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #f8fafc; }
      .code { font-family: Consolas, monospace; font-size: 12px; fill: #dbeafe; }
      .pill { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #e0f2fe; }
      .node { filter: url(#shadow); stroke-width: 1.25; }
      .edge { fill: none; stroke-linecap: round; stroke-width: 2.5; opacity: .95; }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect x="32" y="26" width="1536" height="116" rx="22" fill="url(#head)" stroke="#3b82f6" filter="url(#shadow)"/>
  <text x="70" y="74" class="h" font-size="29">HR DASHBOARD - Semantic, Neural, and Runtime Map</text>
  <text x="70" y="106" class="t" font-size="16">Active source: ACTIVE/ns record.gs + ShellWebApp.gs + index.html | rebuilt 04 Sep 2026</text>
  <g transform="translate(1048 50)">
    <rect width="150" height="54" rx="12" fill="#103b58" stroke="#38bdf8"/><text x="75" y="22" text-anchor="middle" class="pill">RUNTIME GRAPH</text><text x="75" y="42" text-anchor="middle" class="s">1,945 N | 4,403 E</text>
    <rect x="164" width="150" height="54" rx="12" fill="#143d36" stroke="#34d399"/><text x="239" y="22" text-anchor="middle" class="pill">SEMANTIC GRAPH</text><text x="239" y="42" text-anchor="middle" class="s">391 N | 5,800 E</text>
    <rect x="328" width="150" height="54" rx="12" fill="#342356" stroke="#a78bfa"/><text x="403" y="22" text-anchor="middle" class="pill">NEURAL INDEX</text><text x="403" y="42" text-anchor="middle" class="s">281 embeddings active</text>
  </g>
  <path class="edge" stroke="#38bdf8" marker-end="url(#blueArrow)" d="M274 304 C308 304, 316 304, 348 304"/>
  <path class="edge" stroke="#38bdf8" marker-end="url(#blueArrow)" d="M590 304 C624 304, 632 304, 664 304"/>
  <path class="edge" stroke="#34d399" marker-end="url(#greenArrow)" d="M914 304 C950 304, 958 304, 990 304"/>
  <path class="edge" stroke="#38bdf8" marker-end="url(#blueArrow)" d="M1242 304 C1276 304, 1284 304, 1316 304"/>
  <path class="edge" stroke="#34d399" marker-end="url(#greenArrow)" d="M442 596 C518 596, 534 596, 610 596"/>
  <path class="edge" stroke="#34d399" marker-end="url(#greenArrow)" d="M980 596 C1050 596, 1066 596, 1138 596"/>
  <path class="edge" stroke="#a78bfa" stroke-dasharray="8 8" marker-end="url(#violetArrow)" d="M578 878 C674 824, 914 824, 1010 878"/>
  <path class="edge" stroke="#a78bfa" stroke-dasharray="8 8" marker-end="url(#violetArrow)" d="M1258 758 C1258 816, 1258 834, 1258 878"/>
  <g class="node"><rect x="58" y="206" width="216" height="196" rx="18" fill="#123653" stroke="#38bdf8"/><text x="82" y="244" class="nt">1. Permanent link</text><text x="82" y="278" class="code">CONFIG!A2</text><text x="82" y="301" class="code">ShellWebApp.doGet</text><text x="82" y="336" class="s">Validates current backend URL</text><text x="82" y="357" class="s">Forwards deep-link query</text><rect x="82" y="368" width="112" height="22" rx="11" fill="#075985"/><text x="138" y="384" text-anchor="middle" class="pill">SHELL REDIRECT</text></g>
  <g class="node"><rect x="348" y="188" width="242" height="230" rx="18" fill="#17354f" stroke="#38bdf8"/><text x="372" y="226" class="nt">2. Backend and UI</text><text x="372" y="260" class="code">doGet -&gt; index.html</text><text x="372" y="283" class="code">boot / switchView</text><text x="372" y="306" class="code">google.script.run</text><text x="372" y="341" class="s">Four dashboard modules</text><text x="372" y="362" class="s">Status filters and charts</text><rect x="372" y="380" width="90" height="22" rx="11" fill="#075985"/><text x="417" y="396" text-anchor="middle" class="pill">CLIENT</text></g>
  <g class="node"><rect x="664" y="170" width="250" height="268" rx="18" fill="#16394b" stroke="#38bdf8"/><text x="688" y="208" class="nt">3. Identity gate</text><text x="688" y="242" class="code">userLogin</text><text x="688" y="265" class="code">resolveRequestUserProfile_</text><text x="688" y="288" class="code">requireModuleAccess_</text><text x="688" y="311" class="code">KARYAWAN auth workbook</text><text x="688" y="347" class="s">Session email has priority</text><text x="688" y="368" class="s">Module check on every request</text><rect x="688" y="394" width="115" height="22" rx="11" fill="#075985"/><text x="745" y="410" text-anchor="middle" class="pill">FAIL CLOSED</text></g>
  <g class="node"><rect x="990" y="166" width="252" height="276" rx="18" fill="#173f38" stroke="#34d399"/><text x="1014" y="204" class="nt">4. Canonical records</text><text x="1014" y="238" class="code">MASTER KARYAWAN</text><text x="1014" y="261" class="code">nsBuildColumnIndex_</text><text x="1014" y="284" class="code">nsParseDate_</text><text x="1014" y="307" class="code">nsBuildRecords_</text><text x="1014" y="343" class="s">Dynamic header aliases</text><text x="1014" y="364" class="s">Join / Exit dates drive actuals</text><rect x="1014" y="396" width="142" height="22" rx="11" fill="#047857"/><text x="1085" y="412" text-anchor="middle" class="pill">SOURCE OF TRUTH</text></g>
  <g class="node"><rect x="1316" y="206" width="226" height="196" rx="18" fill="#1d3b35" stroke="#34d399"/><text x="1340" y="244" class="nt">5. Analytics APIs</text><text x="1340" y="278" class="code">Headcount / Contract</text><text x="1340" y="301" class="code">Recruitment / Manning</text><text x="1340" y="336" class="s">JSON response contracts</text><text x="1340" y="357" class="s">Prepared cache first</text><rect x="1340" y="368" width="116" height="22" rx="11" fill="#047857"/><text x="1398" y="384" text-anchor="middle" class="pill">ENDPOINTS</text></g>
  <g class="node"><rect x="58" y="510" width="384" height="184" rx="18" fill="#183d35" stroke="#34d399"/><text x="84" y="548" class="nt">Manning plan and Cost Center contract</text><text x="84" y="581" class="code">MANNING DISTRIBUTION</text><text x="84" y="604" class="code">Type | Periode | Cost Center | Head count</text><text x="84" y="637" class="s">Plan is read only for selected YYYY-MM</text><text x="84" y="658" class="s">Actual joins MASTER KARYAWAN Cost Center exactly</text></g>
  <g class="node"><rect x="610" y="490" width="370" height="220" rx="18" fill="#23375d" stroke="#60a5fa"/><text x="636" y="528" class="nt">Prepared dashboard automation</text><text x="636" y="561" class="code">nsInstallDailyDashboardRefresh</text><text x="636" y="584" class="code">ScriptApp daily trigger near 01:00</text><text x="636" y="607" class="code">nsRefreshDashboardCache_ + LockService</text><text x="636" y="642" class="s">Prebuilds four panel payloads and YTD Manning</text><text x="636" y="663" class="s">Live calculation remains the safe fallback</text><rect x="636" y="674" width="130" height="22" rx="11" fill="#1d4ed8"/><text x="701" y="690" text-anchor="middle" class="pill">DAILY PREPARE</text></g>
  <g class="node"><rect x="1138" y="510" width="404" height="184" rx="18" fill="#173e38" stroke="#34d399"/><text x="1164" y="548" class="nt">Derived helper sheets</text><text x="1164" y="581" class="code">_NS_DASHBOARD_CACHE (hidden)</text><text x="1164" y="604" class="code">NS HEADCOUNT MONTHLY (visible)</text><text x="1164" y="637" class="s">UI-ready payload chunks + monthly audit trail</text><text x="1164" y="658" class="s">Never edit these as business source data</text></g>
  <g class="node"><rect x="58" y="822" width="520" height="190" rx="20" fill="#1d2c57" stroke="#818cf8"/><text x="86" y="862" class="nt">Semantic dependency graph</text><text x="86" y="895" class="code">graphify-out/graph.json</text><text x="86" y="922" class="code">391 nodes | 5,800 edges | source + docs map</text><text x="86" y="954" class="s">Static containment, calls, references, and artefact links</text><text x="86" y="976" class="s">Human-readable counterpart: runtime_dependency_mapping.md</text></g>
  <g class="node"><rect x="1010" y="822" width="532" height="190" rx="20" fill="#35245d" stroke="#a78bfa"/><text x="1038" y="862" class="nt">Neural index and control/data graph</text><text x="1038" y="895" class="code">GitNexus: 1,945 nodes | 4,403 edges | 77 flows</text><text x="1038" y="922" class="code">PDG active | 281 embeddings | exact-scan semantic</text><text x="1038" y="954" class="s">VECTOR extension unavailable: no false claim of vector search</text><text x="1038" y="976" class="s">Use impact analysis before changing a runtime symbol</text></g>
  <g transform="translate(58 1042)"><line x1="0" y1="0" x2="42" y2="0" stroke="#38bdf8" stroke-width="3" marker-end="url(#blueArrow)"/><text x="54" y="5" class="s">browser request / response</text><line x1="300" y1="0" x2="342" y2="0" stroke="#34d399" stroke-width="3" marker-end="url(#greenArrow)"/><text x="354" y="5" class="s">source / prepared data dependency</text><line x1="720" y1="0" x2="762" y2="0" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#violetArrow)"/><text x="774" y="5" class="s">semantic / neural indexing path</text></g>
</svg>

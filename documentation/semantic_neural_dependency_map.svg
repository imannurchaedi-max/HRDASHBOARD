<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">NS Record semantic and neural dependency map</title>
  <desc id="desc">Layered overview of active NS Record function dependencies, semantic graph artefacts, and pending neural embeddings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081425"/><stop offset="1" stop-color="#101c36"/></linearGradient>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#172554"/><stop offset="1" stop-color="#0f3a5b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#38bdf8"/></marker>
    <marker id="arrowMint" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#34d399"/></marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#a78bfa"/></marker>
    <style>
      .h { font-family: Arial, sans-serif; font-weight: 700; fill: #f8fafc; }
      .t { font-family: Arial, sans-serif; fill: #cbd5e1; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #94a3b8; }
      .node { filter: url(#shadow); stroke-width: 1.2; }
      .nodeTitle { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #f8fafc; }
      .nodeText { font-family: Consolas, monospace; font-size: 12.5px; fill: #dbeafe; }
      .pillText { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #dbeafe; }
      .edge { fill: none; stroke-linecap: round; stroke-width: 2.5; opacity: .92; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="34" y="28" width="1532" height="116" rx="22" fill="url(#header)" stroke="#334e83" filter="url(#shadow)"/>
  <text x="72" y="76" class="h" font-size="29">NS RECORD — Semantic &amp; Neural Dependency Map</text>
  <text x="72" y="106" class="t" font-size="16">Aktif: ACTIVE/ns record.gs + ShellWebApp.gs + index.html  •  Dibangun 04 Sep 2026</text>
  <g transform="translate(1070 52)">
    <rect width="142" height="50" rx="12" fill="#0c3150" stroke="#38bdf8"/><text x="71" y="22" text-anchor="middle" class="pillText">SEMANTIC GRAPH</text><text x="71" y="40" text-anchor="middle" class="t" font-size="13">338 nodes · 1066 edges</text>
    <rect x="156" width="142" height="50" rx="12" fill="#12362e" stroke="#34d399"/><text x="227" y="22" text-anchor="middle" class="pillText">FUNCTION COVERAGE</text><text x="227" y="40" text-anchor="middle" class="t" font-size="13">63 / 63 named</text>
    <rect x="312" width="142" height="50" rx="12" fill="#35245d" stroke="#a78bfa"/><text x="383" y="22" text-anchor="middle" class="pillText">NEURAL INDEX</text><text x="383" y="40" text-anchor="middle" class="t" font-size="13">awaiting writer lock</text>
  </g>

  <!-- dependency edges behind nodes -->
  <path class="edge" stroke="#38bdf8" marker-end="url(#arrowBlue)" d="M248 324 C292 324, 292 324, 338 324"/>
  <path class="edge" stroke="#34d399" marker-end="url(#arrowMint)" d="M576 324 C620 324, 620 324, 666 324"/>
  <path class="edge" stroke="#34d399" marker-end="url(#arrowMint)" d="M924 324 C968 324, 968 324, 1014 324"/>
  <path class="edge" stroke="#38bdf8" marker-end="url(#arrowBlue)" d="M1274 324 C1322 324, 1322 324, 1362 324"/>
  <path class="edge" stroke="#a78bfa" stroke-dasharray="8 8" marker-end="url(#arrowViolet)" d="M458 520 C570 592, 817 592, 937 520"/>
  <path class="edge" stroke="#a78bfa" stroke-dasharray="8 8" marker-end="url(#arrowViolet)" d="M1112 520 C1112 596, 1112 628, 1112 690"/>
  <path class="edge" stroke="#38bdf8" marker-end="url(#arrowBlue)" d="M800 520 C800 612, 645 614, 645 690"/>
  <path class="edge" stroke="#38bdf8" marker-end="url(#arrowBlue)" d="M1144 520 C1144 612, 1275 614, 1275 690"/>

  <!-- top lane -->
  <g class="node"><rect x="58" y="220" width="190" height="208" rx="18" fill="#12304c" stroke="#38bdf8"/><text x="82" y="258" class="nodeTitle">1. Entry / Shell</text><text x="82" y="290" class="nodeText">ShellWebApp.doGet</text><text x="82" y="314" class="nodeText">Backend doGet</text><text x="82" y="352" class="small">URL /exec validation</text><text x="82" y="373" class="small">deep-link forwarding</text><rect x="82" y="390" width="98" height="22" rx="11" fill="#075985"/><text x="131" y="406" text-anchor="middle" class="pillText">WEB APP</text></g>
  <g class="node"><rect x="338" y="190" width="238" height="268" rx="18" fill="#16334a" stroke="#38bdf8"/><text x="362" y="228" class="nodeTitle">2. Auth &amp; Session Gate</text><text x="362" y="260" class="nodeText">userLogin</text><text x="362" y="282" class="nodeText">resolveRequestUserProfile_</text><text x="362" y="304" class="nodeText">requireModuleAccess_</text><text x="362" y="326" class="nodeText">hasModuleAccess_</text><text x="362" y="348" class="nodeText">getSessionUser / revalidateUser</text><text x="362" y="382" class="small">throttle · cache · fail-closed</text><rect x="362" y="414" width="114" height="22" rx="11" fill="#075985"/><text x="419" y="430" text-anchor="middle" class="pillText">ACCESS CONTROL</text></g>
  <g class="node"><rect x="666" y="170" width="258" height="308" rx="18" fill="#163d38" stroke="#34d399"/><text x="690" y="208" class="nodeTitle">3. Record Builder</text><text x="690" y="240" class="nodeText">nsGetSpreadsheet_ / nsGetSheet_</text><text x="690" y="262" class="nodeText">nsBuildColumnIndex_ / nsCell_</text><text x="690" y="284" class="nodeText">nsParseDate_ / nsCalcAge_</text><text x="690" y="306" class="nodeText">nsNormalize… helpers</text><text x="690" y="328" class="nodeText">nsBuildRecords_</text><text x="690" y="364" class="small">MASTER KARYAWAN → canonical records</text><rect x="690" y="426" width="126" height="22" rx="11" fill="#047857"/><text x="753" y="442" text-anchor="middle" class="pillText">SOURCE OF TRUTH</text></g>
  <g class="node"><rect x="1014" y="172" width="260" height="306" rx="18" fill="#183c34" stroke="#34d399"/><text x="1038" y="210" class="nodeTitle">4. Analytics Endpoints</text><text x="1038" y="242" class="nodeText">getNsHeadcountData</text><text x="1038" y="264" class="nodeText">getNsContractData</text><text x="1038" y="286" class="nodeText">getNsRecruitmentData</text><text x="1038" y="308" class="nodeText">getNsManningData</text><text x="1038" y="342" class="small">segment · drilldown · watchlist</text><text x="1038" y="363" class="small">tenure · recruitment · CC</text><rect x="1038" y="426" width="122" height="22" rx="11" fill="#047857"/><text x="1099" y="442" text-anchor="middle" class="pillText">JSON CONTRACT</text></g>
  <g class="node"><rect x="1362" y="220" width="180" height="208" rx="18" fill="#1c3151" stroke="#38bdf8"/><text x="1386" y="258" class="nodeTitle">5. Dashboard UI</text><text x="1386" y="290" class="nodeText">boot / render</text><text x="1386" y="312" class="nodeText">renderHeadcount</text><text x="1386" y="334" class="nodeText">renderContract</text><text x="1386" y="356" class="nodeText">renderRecruitment</text><text x="1386" y="378" class="nodeText">renderManning</text><rect x="1386" y="390" width="86" height="22" rx="11" fill="#075985"/><text x="1429" y="406" text-anchor="middle" class="pillText">CLIENT</text></g>

  <!-- lower semantic/neural lane -->
  <g class="node"><rect x="294" y="690" width="352" height="208" rx="20" fill="#1d2c57" stroke="#818cf8"/><text x="322" y="730" class="nodeTitle">Semantic Dependency Graph</text><text x="322" y="763" class="t" font-size="15">graphify-out/graph.json</text><text x="322" y="795" class="nodeText">338 nodes  •  1,066 edges</text><text x="322" y="819" class="nodeText">316 extracted function nodes</text><text x="322" y="851" class="small">Static calls, containment, and source links</text><text x="322" y="872" class="small">Coverage verified against ACTIVE/ns record.gs</text></g>
  <g class="node"><rect x="938" y="690" width="348" height="208" rx="20" fill="#35245d" stroke="#a78bfa"/><text x="966" y="730" class="nodeTitle">Neural / Embedding Index</text><text x="966" y="763" class="t" font-size="15">GitNexus semantic exact-scan target</text><text x="966" y="797" class="nodeText">--embeddings  +  --pdg</text><text x="966" y="823" class="small">Pending: embedded database writer lock</text><text x="966" y="847" class="small">When unlocked: semantic similarity + PDG</text><rect x="966" y="862" width="170" height="22" rx="11" fill="#5b21b6"/><text x="1051" y="878" text-anchor="middle" class="pillText">EMBEDDING PENDING</text></g>

  <!-- legend -->
  <g transform="translate(58 948)"><line x1="0" y1="0" x2="42" y2="0" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="54" y="5" class="small">request / response</text><line x1="238" y1="0" x2="280" y2="0" stroke="#34d399" stroke-width="3" marker-end="url(#arrowMint)"/><text x="292" y="5" class="small">record / analytics dependency</text><line x1="548" y1="0" x2="590" y2="0" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrowViolet)"/><text x="602" y="5" class="small">semantic / neural indexing path</text></g>
</svg>

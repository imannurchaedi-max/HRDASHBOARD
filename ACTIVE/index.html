          thSortable('bucket', 'Status') +
          '</tr></thead><tbody>' + (rows || '<tr><td colspan="11" style="padding:20px;text-align:center;color:#475569">Tidak ada data yang sesuai filter ini.</td></tr>') +
          '</tbody></table></div>');

      destroyCharts();
      var barColor = mode === 'nonAktif' ? '#ef4444' : (mode === 'all' ? '#8b5cf6' : '#6366f1');
      barChart('cTahunKontrak', sortTahunKontrak(payload.perTahunKontrak || d.perTahunKontrak || []), false, barColor, (mode === 'all'), function (label) {
        filterContractByTahun(label);
      });

      if (hasTenureFilter) {
        var tbMap = (payload.tenureBreakdown || d.tenureBreakdown || {});
        var searchB = String(SELECTED_CONTRACT_FILTER).trim().toLowerCase();
        var foundBKey = Object.keys(tbMap).find(function(k) { return k.trim().toLowerCase() === searchB; });
        var tenureData = foundBKey ? tbMap[foundBKey] : { perSection: [], perJabatan: [] };

        barChart('cTahunSection', (tenureData.perSection || []).slice(0, 10), false, '#3b82f6', false, function(label) {
          filterContractBySection(label);
        });

        var jabatanRows = tenureData.perJabatan || [];
        if (SELECTED_CONTRACT_SECTION) {
          var unFilteredSectionList = (payload.watchlist || d.watchlist).filter(function(r) {
            return r.bucketTahunKontrak === SELECTED_CONTRACT_FILTER &&
              String(r.bagianRaw || r.bagian || '').trim().toLowerCase() === String(SELECTED_CONTRACT_SECTION).trim().toLowerCase();
          });
          var jCounts = {};
          unFilteredSectionList.forEach(function(r) {
            var j = r.jabatan || '(Tidak Diketahui)';
            jCounts[j] = (jCounts[j] || 0) + 1;
          });
          jabatanRows = Object.keys(jCounts).map(function(k) {
            return { label: k, value: jCounts[k] };
          }).sort(function(a, b) { return b.value - a.value; });
        }

        barChart('cTahunJabatan', jabatanRows.slice(0, 10), false, '#8b5cf6', false, function(label) {
          filterContractByJabatan(label);
        });
      }
    }

    function sortTahunKontrak(rows) {
      var order = ['0 - 1 Thn', '1 - 2 Thn', '2 - 3 Thn', '3 - 4 Thn', '4 - 5 Thn', '> 5 Thn'];
      return rows.slice().sort(function (a, b) {
        var ia = order.indexOf(a.label), ib = order.indexOf(b.label);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
    }

    // =========================================================================
    // PANEL 3: RECRUITMENT
    // =========================================================================
    var RAW_RECRUITMENT_DATA = null;
    var SELECTED_JOIN_VIA = null;

    function renderRecruitment(d) {
      RAW_RECRUITMENT_DATA = d;
      SELECTED_JOIN_VIA = null;
      renderRecruitmentBody();
    }

    function selectJoinViaFilter(label) {
      if (SELECTED_JOIN_VIA === label) {
        SELECTED_JOIN_VIA = null;
      } else {
        SELECTED_JOIN_VIA = label;
      }
      renderRecruitmentBody();
    }

    function clearJoinViaFilter() {
      SELECTED_JOIN_VIA = null;
      renderRecruitmentBody();
    }

    function renderRecruitmentBody() {
      if (!RAW_RECRUITMENT_DATA) return;
      var d = RAW_RECRUITMENT_DATA;
      var mode = CURRENT_GLOBAL_SEGMENT;
      var payload = mode === 'nonAktif' ? (d.nonAktifData || d) : (mode === 'all' ? (d.allData || d) : (d.aktifData || d));
      var k = d.kpi;

      $('viewChip').textContent = nf(k.total) + ' record - ' + mode.toUpperCase();
      if (payload.trenMasuk && payload.trenMasuk.length) {
        $('updChip').textContent = payload.trenMasuk[0].label + ' s/d ' + payload.trenMasuk[payload.trenMasuk.length - 1].label;
      }

      var dead = (payload.perJoinVia || d.perJoinVia).filter(function (s) { return s.aktif === 0 && s.total >= 5; });
      var deadWarn = dead.length
        ? '<div class="warn crit"><span class="warn-i">&#9888;</span><div>' +
        '<div class="warn-t">Sumber dengan retensi 0%: ' + dead.map(function (s) { return esc(s.label); }).join(', ') + '</div>' +
        '<div class="warn-b">' + dead.map(function (s) {
          return nf(s.total) + ' orang direkrut lewat ' + esc(s.label) + ', tidak satu pun masih aktif';
        }).join('. ') + '.</div></div></div>'
        : '';

      var retHtml = '<div class="ret">' + (payload.perJoinVia || d.perJoinVia).map(function (s) {
        var color = s.retensiPersen >= 65 ? '#10b981' : s.retensiPersen >= 40 ? '#f59e0b' : '#ef4444';
        return '<div class="ret-r"><div class="ret-h">' +
          '<span class="ret-n">' + esc(s.label) + '</span>' +
          '<span class="ret-m">' + nf(s.total) + ' direkrut - ' + nf(s.aktif) + ' aktif - ' + nf(s.keluar) + ' keluar</span>' +
          '<span class="ret-p" style="color:' + color + '">' + String(s.retensiPersen).replace('.', ',') + '%</span>' +
          '</div><div class="ret-t">' +
          '<span class="ret-a" style="width:' + s.retensiPersen + '%"></span>' +
          '<span class="ret-k" style="width:' + (100 - s.retensiPersen) + '%"></span>' +
          '</div></div>';
      }).join('') + '</div>';

      var refData = payload.perReferensi || d.perReferensi || [];
      var refSubTitle = 'semua sumber - klik batang Join Via di sebelah kiri untuk filter';

      if (SELECTED_JOIN_VIA) {
        var mapByJv = payload.referensiMapByJoinVia || d.referensiMapByJoinVia || {};
        var searchKey = String(SELECTED_JOIN_VIA).trim().toUpperCase();
        var keys = Object.keys(mapByJv);
        var foundKey = keys.find(function(k) { return String(k).trim().toUpperCase() === searchKey; });
        refData = foundKey ? mapByJv[foundKey] : [];
        refSubTitle = 'Filter: ' + esc(SELECTED_JOIN_VIA) + ' (' + refData.length + ' referensi) ' +
          '<button onclick="clearJoinViaFilter()" style="margin-left:8px;background:#1e293b;color:#fff;border:none;border-radius:12px;padding:2px 8px;font-size:0.72rem;cursor:pointer;">Reset Filter</button>';
      }

      $('viewBody').innerHTML =
        warnMissingCols(d.warnings) + warnDupNik(d.warnings) + deadWarn +
        '<div class="kpi-grid">' +
        kpi('Total Direkrut', nf(k.total), 'seluruh riwayat') +
        kpi('Masih Aktif', nf(k.totalAktif), k.total ? 'retensi ' + (Math.round(k.totalAktif / k.total * 1000) / 10).toString().replace('.', ',') + '%' : '', '#10b981') +
        kpi('Sumber Rekrutmen', nf(k.jumlahSumber), (payload.perJoinVia || d.perJoinVia).map(function (s) { return s.label; }).join(' - ')) +
        kpi('Referensi Unik', nf(k.jumlahReferensi), 'setelah normalisasi ejaan') +
        '</div>' +
        card('Retensi per Sumber Rekrutmen', 'hijau = masih aktif, merah = sudah keluar', retHtml) +
        card('Tren Rekrutmen per Bulan', 'berdasarkan Tanggal Masuk', canvas('cTren')) +
        '<div class="report-shift-grid">' +
        card('Join Via (Sumber Rekrutmen)', 'klik batang diagram untuk filter Referensi', canvas('cJoinVia', true)) +
        card('Referensi Terbesar', refSubTitle, canvas('cRef', true)) +
        '</div>' +
        '<div class="report-shift-grid">' +
        card('Alasan Keluar Utama', mode === 'aktif' ? 'catatan riwayat keluar' : 'karyawan non aktif', canvas('cReason', true)) +
        card('Kecamatan Teratas', 'domisili karyawan', canvas('cKec', true)) +
        '</div>';

      destroyCharts();
      lineChart('cTren', payload.trenMasuk || d.trenMasuk);
      var barColor = mode === 'nonAktif' ? '#ef4444' : (mode === 'all' ? '#8b5cf6' : '#3b82f6');
      
      barChart('cJoinVia', (payload.perJoinVia || d.perJoinVia).slice(0, 8), true, barColor, false, function (label) {
        selectJoinViaFilter(label);
      });
      barChart('cRef', refData.slice(0, 8), true, '#8b5cf6');
      barChart('cReason', (payload.perReasonKeluar || d.perReasonKeluar).slice(0, 8), true, '#ef4444');
      barChart('cKec', (payload.perKecamatan || d.perKecamatan).slice(0, 8), true, '#06b6d4');
    }

    function render(view, data) {
      if (view === 'headcount') renderHeadcount(data);
      else if (view === 'contract') renderContract(data);
      else if (view === 'recruitment') renderRecruitment(data);
      else renderManning(data);
    }

    boot();
  </script>
</body>

</html>
